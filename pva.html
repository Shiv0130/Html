            });

        async function getCurrentWeather() {
            const apiKey = '8f2751d8f8683d4abfc8076553e81b54';
            const city = 'Durban';
            const url = `https://api.openweathermap.org/data/2.5/weather?q=${safeUrlEncode(city)}&units=metric&appid=${apiKey}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (response.ok) {
                    return `The current weather in ${sanitizeInput(city)} is ${sanitizeInput(data.weather[0].description)} with a temperature of ${data.main.temp.toFixed(1)}°C.`;
                } else {
                    return `Sorry, I could not fetch the weather data. Error: ${sanitizeInput(data.message)}`;
                }
            } catch (error) {
                console.error("Weather fetch error:", error);
                return 'Sorry, I could not fetch the weather data at the moment.';
            }

        // Format time in human-readable format
        function formatTime(hours, minutes) {
            const period = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            return `${hours}:${minutes < 10 ? '0' + minutes : minutes} ${period}`;
        }

            window.speechSynthesis.speak(speech);

        // Extract PHP script name from command
        function extractPhpScriptName(command) {
            const patterns = [
                /run php script\s+(\w+(?:\.\w+)?)/i,
                /run php\s+(\w+(?:\.\w+)?)/i,
                /open php\s+(\w+(?:\.\w+)?)/i,
                /run the php\s+(\w+(?:\.\w+)?)/i,
                /run this php script\s+(\w+(?:\.\w+)?)/i,
                /run script\s+(\w+(?:\.\w+)?)/i
            ];
            
            for (let pattern of patterns) {
                const match = command.match(pattern);
                if (match && match[1]) {
                    return match[1].endsWith('.php') ? match[1] : `${match[1]}.php`;
                }

            return "hello.php";
