<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        background: linear-gradient(135deg, #ff4e8a, #ff9ecf);
        font-family: 'Segoe UI', sans-serif;
        overflow: hidden;
        text-align: center;
        color: white;
    }

    h1 {
        font-size: 3rem;
        margin-bottom: 40px;
        opacity: 0;
        transition: opacity 0.6s ease, transform 0.6s ease;
        transform: translateY(-20px);
    }

    .show {
        opacity: 1;
        transform: translateY(0);
    }

    .heart {
        font-size: 60px;
        cursor: pointer;
        transition: transform 0.3s ease;
        animation: pulse 1.5s infinite;
    }

    .heart:hover {
        transform: scale(1.2);
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.15); }
        100% { transform: scale(1); }
    }

    /* Floating hearts */
    .floating-heart {
        position: absolute;
        font-size: 20px;
        opacity: 0.7;
        animation: floatUp 6s linear infinite;
    }

    @keyframes floatUp {
        0% { transform: translateY(100vh); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateY(-10vh); opacity: 0; }
    }
</style>
</head>

<body>

<h1 id="text"></h1>
<div class="heart" onclick="nextStep()">❤️</div>

<script>
    let step = 0;
    const text = document.getElementById("text");

    function nextStep() {
        step++;

        if (step === 1) {
            text.innerHTML = "Hi there ❤️";
        } 
        else if (step === 2) {
            text.innerHTML = "I got a question for you…";
        } 
        else if (step === 3) {
            text.innerHTML = "Will you be my Valentine? 😊";
        }

        text.classList.remove("show");
        void text.offsetWidth; // restart animation
        text.classList.add("show");
    }

    // Floating hearts background
    function createHeart() {
        const heart = document.createElement("div");
        heart.classList.add("floating-heart");
        heart.innerHTML = "❤";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 20 + 10 + "px";
        heart.style.animationDuration = Math.random() * 3 + 3 + "s";
        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 6000);
    }

    setInterval(createHeart, 600);
</script>

</body>
</html>
