// simple parser WITHOUT regex backslashes to avoid replacement issues
function parseRawSimple(raw){
const lines = raw.split('\n');
const items = [];
  let i = 0;
  while(i < lines.length){
    const line = lines[i].trim();
    if(line.startsWith('00:')){
      // timestamp line, e.g. "00:00:14 Speaker 2"
      const parts = line.split(' ');
      const ts = parts[0];
      // find 'Speaker' token index
      let sp = 1;
      for(let k=1;k<parts.length;k++){
        if(parts[k].toLowerCase() === 'speaker'){
          if(k+1 < parts.length) sp = Number(parts[k+1]);
          break;
        }
      }
      // next lines until next timestamp are the text
      let textParts = [];
      let j = i+1;
      while(j < lines.length && !lines[j].trim().startsWith('00:')){
        if(lines[j].trim() !== '') textParts.push(lines[j].trim());
        j++;
      }
      const text = textParts.join(' ');
      const start = toSecondsSimple(ts);
      items.push({start, speaker:sp, text});
      i = j;
    } else {
      i++;
    }
  }
  return items;
}
function toSecondsSimple(ts){const p = ts.split(':').map(function(x){return parseInt(x,10)});return p[0]*3600 + p[1]*60 + p[2];}

transcript = parseRawSimple(rawTranscript);

    div.id = 't-'+i;
    div.innerHTML = '<div class="time">' + formatTime(t.start) + '</div><div><strong>Speaker ' + t.speaker + ':</strong> ' + escapeHtml(t.text) + '</div>';
    div.addEventListener('click', function(){audio.currentTime = t.start; audio.play();});
    transcriptDiv.appendChild(div);
  });
}

function formatTime(s){
  const hh = Math.floor(s/3600); const mm = Math.floor((s%3600)/60); const ss = Math.floor(s%60);
  return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');
}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ====== Audio + Visualizer ====== */
const fileInput = document.getElementById('fileInput');
const audio = document.getElementById('audio');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let audioCtx, analyser, sourceNode, dataArray, bufferLength;
let animationId; const devicePixelRatio = window.devicePixelRatio || 1;

function setupAudioFromFile(file){
  if(!file) return;
  if(audioCtx) audioCtx.close();
  audio.src = URL.createObjectURL(file);
  audio.load();
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  sourceNode = audioCtx.createMediaElementSource(audio);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048; bufferLength = analyser.frequencyBinCount; dataArray = new Uint8Array(bufferLength);
  sourceNode.connect(analyser); analyser.connect(audioCtx.destination);
  resizeCanvas(); draw();
}

fileInput.addEventListener('change', function(e){
  const f = e.target.files[0]; if(f) setupAudioFromFile(f);
});

window.addEventListener('resize', resizeCanvas);
function resizeCanvas(){canvas.width = canvas.clientWidth * devicePixelRatio; canvas.height = canvas.clientHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}

function draw(){
  animationId = requestAnimationFrame(draw);
  if(!analyser) return;
  analyser.getByteFrequencyData(dataArray);

  // clear
  ctx.clearRect(0,0,canvas.width/devicePixelRatio,canvas.height/devicePixelRatio);
  const w = canvas.clientWidth; const h = canvas.clientHeight;

  // background gradient
  const grad = ctx.createLinearGradient(0,0,w,0);
  grad.addColorStop(0,'rgba(0,0,0,0)'); grad.addColorStop(1,'rgba(0,0,0,0.15)');
  ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);

  // bars
  const vizStyle = document.getElementById('vizStyle').value;
  const barCount = Math.min(128, bufferLength);
  const barWidth = (w / barCount) * 0.8;
  let x=0;
  for(let i=0;i<barCount;i++){
    const v = dataArray[i]/255; const barH = v * h * 0.9;
    const r = Math.floor(120 + v*135); const g = Math.floor(50 + v*120); const b = 255 - Math.floor(v*80);
    if(vizStyle==='bars' || vizStyle==='combined'){
      ctx.fillStyle = 'rgb('+r+','+g+','+b+')';
      ctx.fillRect(x, h - barH, barWidth, barH);
    }
    x += barWidth + 1;
  }

  // waveform
  if(vizStyle==='wave' || vizStyle==='combined'){
    const timeData = new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(timeData);
    ctx.lineWidth = 2; ctx.beginPath();
    const slice = w / timeData.length; let xx = 0;
    for(let i=0;i<timeData.length;i+=Math.max(1,Math.floor(timeData.length/800))){
      const v = timeData[i]/128.0; const y = (v*0.5) * h;
      if(i===0) ctx.moveTo(xx,y); else ctx.lineTo(xx,y);
      xx += slice;
    }
    ctx.strokeStyle = 'rgba(0,229,168,0.9)'; ctx.stroke();
  }

  // glow when playing
  if(!audio.paused){ ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle='rgba(0,229,168,0.02)'; ctx.fillRect(0,0,w,h); ctx.globalCompositeOperation='source-over'; }
}

// simple parser WITHOUT regex backslashes to avoid replacement issues
function parseRawSimple(raw){
const lines = raw.split('\n');
const items = [];
  let i = 0;
  while(i < lines.length){
    const line = lines[i].trim();
    if(line.startsWith('00:')){
      // timestamp line, e.g. "00:00:14 Speaker 2"
      const parts = line.split(' ');
      const ts = parts[0];
      // find 'Speaker' token index
      let sp = 1;
      for(let k=1;k<parts.length;k++){
        if(parts[k].toLowerCase() === 'speaker'){
          if(k+1 < parts.length) sp = Number(parts[k+1]);
          break;
        }
      }
      // next lines until next timestamp are the text
      let textParts = [];
      let j = i+1;
      while(j < lines.length && !lines[j].trim().startsWith('00:')){
        if(lines[j].trim() !== '') textParts.push(lines[j].trim());
        j++;
      }
      const text = textParts.join(' ');
      const start = toSecondsSimple(ts);
      items.push({start, speaker:sp, text});
      i = j;
    } else {
      i++;
    }
  }
  return items;
}
function toSecondsSimple(ts){const p = ts.split(':').map(function(x){return parseInt(x,10)});return p[0]*3600 + p[1]*60 + p[2];}

transcript = parseRawSimple(rawTranscript);

  transcriptDiv.innerHTML='';
  transcript.forEach((t,i)=>{
    const div = document.createElement('div');
    div.className = `transcript-line speaker-${t.speaker}`;
    div.id = 't-'+i;
    div.innerHTML = '<div class="time">' + formatTime(t.start) + '</div><div><strong>Speaker ' + t.speaker + ':</strong> ' + escapeHtml(t.text) + '</div>';
    div.addEventListener('click', function(){audio.currentTime = t.start; audio.play();});
    transcriptDiv.appendChild(div);
  });
}

function formatTime(s){
  const hh = Math.floor(s/3600); const mm = Math.floor((s%3600)/60); const ss = Math.floor(s%60);
  return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');
}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  // background gradient
  const grad = ctx.createLinearGradient(0,0,w,0);
  grad.addColorStop(0,'rgba(0,0,0,0)'); grad.addColorStop(1,'rgba(0,0,0,0.15)');
  ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);

  // bars
  const vizStyle = document.getElementById('vizStyle').value;
  const barCount = Math.min(128, bufferLength);
  const barWidth = (w / barCount) * 0.8;
  let x=0;
  for(let i=0;i<barCount;i++){
    const v = dataArray[i]/255; const barH = v * h * 0.9;
    const r = Math.floor(120 + v*135); const g = Math.floor(50 + v*120); const b = 255 - Math.floor(v*80);
    if(vizStyle==='bars' || vizStyle==='combined'){
      ctx.fillStyle = 'rgb('+r+','+g+','+b+')';
      ctx.fillRect(x, h - barH, barWidth, barH);
    }
    x += barWidth + 1;
  }

  // waveform
  if(vizStyle==='wave' || vizStyle==='combined'){
    const timeData = new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(timeData);
    ctx.lineWidth = 2; ctx.beginPath();
    const slice = w / timeData.length; let xx = 0;
    for(let i=0;i<timeData.length;i+=Math.max(1,Math.floor(timeData.length/800))){
      const v = timeData[i]/128.0; const y = (v*0.5) * h;
      if(i===0) ctx.moveTo(xx,y); else ctx.lineTo(xx,y);
      xx += slice;
    }
    ctx.strokeStyle = 'rgba(0,229,168,0.9)'; ctx.stroke();
  }

  // glow when playing
  if(!audio.paused){ ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle='rgba(0,229,168,0.02)'; ctx.fillRect(0,0,w,h); ctx.globalCompositeOperation='source-over'; }
}

/* ====== Syncing transcript with audio ====== */
let lastActive = -1;
function updateActiveLine(){
  const t = audio.currentTime;
  for(let i=0;i<transcript.length;i++){
    const curr = transcript[i]; const next = transcript[i+1] ? transcript[i+1].start : Infinity;
    const el = document.getElementById('t-'+i);
    if(t>=curr.start && t<next){
      if(lastActive!==i){
        if(lastActive>=0){document.getElementById('t-'+lastActive).classList.remove('current');}
        el.classList.add('current'); el.scrollIntoView({behavior:'smooth',block:'center'});
        lastActive = i;
      }
      break;
    }
  }
}

audio.addEventListener('timeupdate', updateActiveLine);

/* ====== Controls ====== */
document.getElementById('playAll').addEventListener('click', function(){audio.play();});
document.getElementById('pauseAll').addEventListener('click', function(){audio.pause();});
document.getElementById('jumpBack').addEventListener('click', function(){audio.currentTime = Math.max(0,audio.currentTime - 5);});
document.getElementById('jumpFwd').addEventListener('click', function(){audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);});

/* ====== speaker color controls ====== */
const s1c = document.getElementById('s1color'); const s2c = document.getElementById('s2color');
s1c.addEventListener('input', function(e){document.documentElement.style.setProperty('--s1', e.target.value); document.querySelectorAll('.speaker-1').forEach(function(el){el.style.borderLeftColor = e.target.value})});
s2c.addEventListener('input', function(e){document.documentElement.style.setProperty('--s2', e.target.value); document.querySelectorAll('.speaker-2').forEach(function(el){el.style.borderLeftColor = e.target.value})});

// set initial colors
s1c.dispatchEvent(new Event('input')); s2c.dispatchEvent(new Event('input'));

document.getElementById('vizStyle').addEventListener('change', function(){document.getElementById('modeLabel').textContent = document.getElementById('vizStyle').value;});

/* ====== theme toggle ====== */
const themeToggle = document.getElementById('themeToggle'); themeToggle.addEventListener('click', function(){
  const el = document.body; if(el.getAttribute('data-theme') === 'dark'){el.setAttribute('data-theme','light'); themeToggle.textContent='🌒'} else {el.setAttribute('data-theme','dark'); themeToggle.textContent='🌗'}
});

/* ====== Download transcript JSON ====== */
document.getElementById('downloadBtn').addEventListener('click', function(){
  const out = transcript.map(function(t,i){return {start:t.start, end: transcript[i+1]?transcript[i+1].start : (t.start+5), speaker:t.speaker, text:t.text}});
  const blob = new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'transcript.json'; a.click();
});

/* ====== utilities ====== */
function init(){ resizeCanvas(); renderTranscript(); }
init();
